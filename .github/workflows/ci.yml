name: CI & Publish
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: greenticai/.github/.github/workflows/host-crate-ci.yml@main
    with:
      run-semver-checks: false
      setup-script: |
        bash ci/check_no_duplicate_canonical_wit.sh
        if [ "$(uname -s)" = "Linux" ]; then
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
        fi
        sudo apt-get update && sudo apt-get install -y lld clang
        mkdir -p .cargo
        cat > .cargo/config.toml <<'TOML'
        [target.x86_64-unknown-linux-gnu]
        linker = "clang"
        rustflags = ["-C", "link-arg=-fuse-ld=lld"]
        TOML
        rustup target add wasm32-wasip2
        if [ ! -x "$HOME/.cargo/bin/cargo-binstall" ]; then
          cargo install cargo-binstall --locked
        fi
        BINSTALL_DISABLE_STRATEGIES=compile cargo binstall cargo-component -y --force || cargo install cargo-component --locked --force
        BINSTALL_DISABLE_STRATEGIES=compile cargo binstall greentic-component -y --force || cargo install greentic-component --locked --force
        BINSTALL_DISABLE_STRATEGIES=compile cargo binstall wasm-tools -y --force
      test-args: "--workspace --all-features --locked"

  semver-checks:
    name: Semver Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semver-${{ runner.os }}-rust-1.95-${{ hashFiles('**/Cargo.lock') }}
      - name: Setup semver environment
        run: |
          bash ci/check_no_duplicate_canonical_wit.sh
          if [ "$(uname -s)" = "Linux" ]; then
            df -h
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
            df -h
          fi
          sudo apt-get update && sudo apt-get install -y lld clang
          mkdir -p .cargo
          cat > .cargo/config.toml <<'TOML'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          TOML
          rustup target add wasm32-wasip2
          if [ ! -x "$HOME/.cargo/bin/cargo-binstall" ]; then
            cargo install cargo-binstall --locked
          fi
          BINSTALL_DISABLE_STRATEGIES=compile cargo binstall cargo-component -y --force || cargo install cargo-component --locked --force
          BINSTALL_DISABLE_STRATEGIES=compile cargo binstall greentic-component -y --force || cargo install greentic-component --locked --force
          BINSTALL_DISABLE_STRATEGIES=compile cargo binstall wasm-tools -y --force
      - name: Resolve semver baseline tag
        id: semver-baseline
        run: |
          git fetch --tags --force
          # Pick the baseline from the SAME major.minor version line the
          # workspace currently sits on. Without this filter the workflow
          # picks whatever v* tag sorts highest — including 1.1.x dev tags
          # auto-cut on the `develop` branch — and tries to build their
          # source against the current 0.5.x dependency graph. That fails
          # with E0432 on `greentic_types::telemetry::attr_keys` (the dev
          # line's API) before semver-checks ever runs, blocking every PR
          # on the stable lane.
          ws_version="$(perl -ne 'print $1 if /^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+[^"]*)"/' Cargo.toml | head -n 1)"
          if [ -z "$ws_version" ]; then
            echo "Could not read workspace version from Cargo.toml" >&2
            exit 1
          fi
          major_minor="$(echo "$ws_version" | cut -d. -f1,2)"
          echo "Workspace version: $ws_version (line: $major_minor.x)"
          all_tags="$(git tag -l "v${major_minor}.*" --sort=-v:refname)"
          # Filter to stable tags only: dev-lane tags use GitHub run IDs as
          # patch numbers (10+ digits, e.g. v1.1.28349987150) which sort
          # above real stable releases (v1.1.1, v1.1.2). Comparing against
          # a dev tag uses the wrong API surface and produces false positives.
          line_tags="$(echo "$all_tags" | while IFS= read -r t; do
            patch="${t##*.}"
            if [ "$patch" -le 999 ] 2>/dev/null; then echo "$t"; fi
          done)"
          if [ -z "$line_tags" ]; then
            echo "No stable v${major_minor}.* tag found (filtered out $(echo "$all_tags" | wc -l) dev tags); semver-checks needs a same-line baseline" >&2
            exit 1
          fi
          newest_tag="$(echo "$line_tags" | sed -n '1p')"
          # When HEAD itself IS the newest tag on this line (release-cut),
          # compare against the previous one. Otherwise compare against
          # the newest on-line tag.
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "$newest_tag")" ]; then
            baseline_tag="$(echo "$line_tags" | sed -n '2p')"
            if [ -z "$baseline_tag" ]; then
              echo "HEAD is the only v${major_minor}.* tag; nothing to compare against" >&2
              exit 1
            fi
          else
            baseline_tag="$newest_tag"
          fi
          echo "baseline_tag=$baseline_tag" >> "$GITHUB_OUTPUT"
          echo "Using semver baseline tag: $baseline_tag"
      - name: Run semver checks against previous git tag
        run: |
          rustup override set 1.95.0
          rustc --version
          cargo --version
          cargo install cargo-semver-checks --locked --force
          cargo semver-checks check-release \
            --baseline-rev "${{ steps.semver-baseline.outputs.baseline_tag }}" \
            --package greentic-pack \
            --package greentic-pack-lib \
            --package pack_component_template

  release:
    name: Build binaries + Release
    needs: [ci, semver-checks]
    if: >-
      needs.ci.result == 'success' && needs.semver-checks.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}-${{ matrix.target }}-rust-1.95-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Linux toolchains
        if: matrix.os == 'ubuntu-latest'
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y lld clang gcc-aarch64-linux-gnu; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "apt-get failed after 3 attempts" >&2; exit 1; fi
            echo "apt-get attempt $attempt failed or timed out; retrying in 15s" >&2
            sleep 15
          done
      - name: Configure lld for native Linux x86_64 builds
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF
      - name: Configure linker for Linux aarch64 builds
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: Derive release tag and title from workspace version
        run: |
          set -euo pipefail
          # Only the workspace package version (first `^version = "..."`, under
          # [workspace.package]); stop before [workspace.dependencies] whose
          # entries also start lines with `version = "..."` and would otherwise
          # concatenate into a malformed tag.
          version=$(perl -ne 'if (/^version\s*=\s*"([^"]+)"/) { print "$1\n"; last }' Cargo.toml)
          tag="v${version}"
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=${tag}" >> "$GITHUB_ENV"
      - name: Build binstall artifacts
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} --package greentic-pack --bin greentic-pack
          out_dir="target/${{ matrix.target }}/release"
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows-msvc" ]]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path '${out_dir}/greentic-pack.exe' -DestinationPath 'dist/greentic-pack-${{ matrix.target }}.zip' -Force"
          else
            tar -czf "dist/greentic-pack-${{ matrix.target }}.tgz" -C "${out_dir}" greentic-pack
          fi
      - name: Upload binstall artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/greentic-pack-${{ matrix.target }}.*
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
