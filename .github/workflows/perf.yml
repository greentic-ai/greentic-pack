name: Perf (lightweight)
# Moved off pull_request onto a nightly schedule. See plans/binary-bifurcation.md
# Phase A (heavy-job sweep). Manual runs remain via workflow_dispatch. push
# trigger preserved so main-merge still catches regressions immediately.

on:
  schedule:
    - cron: "14 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Run perf guard tests
        run: cargo test -p greentic-pack-lib --test perf_scaling --test perf_timeout

      - name: Run criterion smoke benchmarks
        run: cargo bench -p greentic-pack-lib --bench perf -- --sample-size 10
