name: Nightly Coverage

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  coverage:
    name: Validate Coverage Policy
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/coverage-ci
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-wasip2
          components: llvm-tools-preview

      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lld clang

      - name: Configure lld for native Linux builds
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF

      - uses: cargo-bins/cargo-binstall@main

      - name: Install required coverage tools
        run: |
          cargo binstall -y --force \
            cargo-component \
            cargo-llvm-cov \
            greentic-component \
            greentic-dev \
            wasm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-coverage-rust-1.91-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate repo coverage policy
        run: greentic-dev coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-artifacts
          path: |
            coverage-policy.json
            target/coverage/**
            target/llvm-cov-target/**
          if-no-files-found: ignore
