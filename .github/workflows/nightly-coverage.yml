name: Nightly Coverage

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Validate Coverage Policy
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/coverage-ci
      # Coverage is read from each binary's __llvm_covmap section, not DWARF, so
      # debug info is dead weight. Leaving it on builds 37 GB of instrumented
      # artifacts across 65 test binaries that each statically link wasmtime,
      # which makes linking by far the heaviest phase of this job.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip2
          components: llvm-tools-preview

      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lld clang

      - name: Configure lld for native Linux builds
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF

      - uses: cargo-bins/cargo-binstall@main

      - name: Install required coverage tools
        run: |
          cargo binstall -y --force \
            cargo-component \
            cargo-llvm-cov \
            cargo-nextest \
            greentic-component \
            greentic-dev \
            wasm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-coverage-rust-1.95-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # Tee the run so a failure stays diagnosable even when GitHub drops the
      # job log blob, as it did for the exit-4 run on 2026-07-09.
      - name: Validate repo coverage policy
        run: |
          set -o pipefail
          greentic-dev coverage 2>&1 | tee coverage-run.log

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-artifacts
          path: |
            coverage-policy.json
            coverage-run.log
            target/coverage/**
          if-no-files-found: ignore
