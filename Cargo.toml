[workspace]
members = [
    "crates/greentic-pack",
    "crates/pack_component",
    "crates/pack_component_template",
    "crates/packc",
]
exclude = [
    "crates/packc/tests/router_echo",
    "examples/qa-demo/.packc/pack_component",
    "examples/weather-demo/.packc/pack_component",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.5.7"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
base64 = "0.22"
blake3 = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
constant_time_eq = "0.5"
criterion = "0.8"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
getrandom = "0.4"
greentic-config = "0.5"
greentic-config-types = "0.5"
greentic-distributor-client = { version = "0.5", default-features = false, features = ["reqwest", "dist-client"] }
greentic-flow = { version = "0.5" }
greentic-i18n-lib = "0.5"
greentic-interfaces-host = { version = "0.5" }
greentic-interfaces-wasmtime = { version = "0.5" }
greentic-pack = { package = "greentic-pack-lib", path = "crates/greentic-pack", version = "0.5" }
greentic-qa-lib = "0.5"
greentic-telemetry = { version = "0.5", features = ["otlp"] }
greentic-types = { version = "0.5" }
hex = "0.4"
hyper = "1"
ignore = "0.4"
indexmap = "2"
indoc = "2"
pack_component_template = { version = "0.5", path = "crates/pack_component_template" }
pkcs8 = { version = "0.10", features = ["pem"] }
predicates = "3"
rand_core = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rustls-pki-types = "1"
schemars = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2" }
sha2 = "0.11"
sys-locale = "0.3"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["macros", "serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
unic-langid = "0.9"
walkdir = "2"
wasmtime = "43"
wasmtime-wasi = "43"
wasmtime-wasi-http = { version = "43", default-features = false, features = ["p2"] }
wit-bindgen = { version = "0.54", default-features = false, features = ["macros", "realloc"] }
wit-component = "0.247"
x509-parser = "0.18"
zip = { version = "8", default-features = false, features = ["deflate"] }
